apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opspilot

commonLabels:
  app.kubernetes.io/name: opspilot
  app.kubernetes.io/part-of: opspilot

resources:
  - namespace.yml
  - backend-configmap.yml
  - backend-secret.example.yml
  - mongodb-secret.example.yml
  - redis-secret.example.yml
  - backend-deployment.yml
  - backend-service.yml
  - frontend-deployment.yml
  - frontend-service.yml
  - mongodb-statefulset.yml
  - mongodb-service.yml
  - redis-statefulset.yml
  - redis-service.yml
  - ingress.yml
  - hpa.yml

