apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opspilot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bharathhonakatti26/OpsPilot.git
    targetRevision: develop
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: opspilot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
