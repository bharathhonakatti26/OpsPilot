version: "3.9"

services:
  mongo:
    image: mongo:latest
    container_name: opspilot-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - opspilot-network

  redis:
    image: redis:7-alpine
    container_name: opspilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - opspilot-network

  backend:
    image: opspilot-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opspilot-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
      - redis
    environment:
      MONGO_URI: mongodb://mongo:27017/opspilot
      REDIS_URL: redis://redis:6379
    networks:
      - opspilot-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    image: opspilot-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opspilot-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - opspilot-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  opspilot-network:
    driver: bridge

volumes:
  mongodb_data:
